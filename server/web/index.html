<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>PokerBench</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="refresh" content="0; url=/web/leaderboard.html"/>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml"/>
  <script src="/web/app.js" defer></script>
  <link rel="stylesheet" href="/web/app.css?v=7"/>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const target = '/web/leaderboard.html';
      if (location.pathname !== target) {
        try { window.location.replace(target); return; } catch {}
      }
    });
  </script>
</head>
<body>
  <main class="page-content">
    <div class="wrap">
      <div class="card card--compact">
        <h1>Redirecting…</h1>
        <p class="muted">If the leaderboard does not load automatically, <a href="/web/leaderboard.html">open it directly</a>.</p>
      </div>
    </div>
  </main>
</body>
</html>
