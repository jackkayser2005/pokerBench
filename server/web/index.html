<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>PokerBench</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="refresh" content="0; url=/web/leaderboard.html"/>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/web/app.css?v=5"/>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const target = '/web/leaderboard.html';
      if (location.pathname !== target) {
        window.location.replace(target);
      }
    });
  </script>
</head>
<body class="redirect-page">
  <main class="page-content">
    <div class="wrap">
      <div class="card card--compact">
        <h1>Redirecting to the leaderboard</h1>
        <p class="muted">Your browser should automatically open the latest PokerBench standings. If it doesn’t, <a href="/web/leaderboard.html">continue to the leaderboard</a>.</p>
      </div>
    </div>
  </main>
</body>
</html>
