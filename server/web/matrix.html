<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AI Poker Lab — Win Matrix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml"/>
  <script src="/web/theme-init.js"></script>
  <link rel="stylesheet" href="/web/app.css?v=11"/>
  <script src="/web/app.js" defer></script>
  <script src="/web/compare.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      document.querySelectorAll('.topnav__links a').forEach(a=>{ try{ if(location.pathname.endsWith(a.getAttribute('href').split('/').pop())) a.classList.add('active'); }catch(e){} });
      const drawerEl = document.getElementById('compareDrawer');
      if (drawerEl && window.PokerBench?.CompareDrawer){
        compareDrawer = window.PokerBench.CompareDrawer.create(drawerEl, {
          onClose: ()=>{
            if (activePinnedCell){
              activePinnedCell.classList.remove('matrix-cell--active');
              activePinnedCell.setAttribute('aria-pressed', 'false');
              activePinnedCell = null;
            }
          }
        });
      }
    });
    const $ = s => document.querySelector(s);
    const nf = new Intl.NumberFormat();
    const formatNumber = n => {
      const num = Number(n);
      return Number.isFinite(num) ? nf.format(num) : '0';
    };
    let matrixTooltip;
    let tooltipActiveCell = null;
    let tooltipScrollHandlerAttached = false;
    let activePinnedCell = null;
    let compareDrawer = null;
    function heat(p){
      const x = Math.max(0, Math.min(1, p));
      const hue = 240*(1-x); // blue -> red
      return `background-color: hsl(${hue} 70% 42% / .22)`;
    }
    function escapeAttr(s = ''){
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
    function shortName(s){
      s = (s||'').trim().replace(/^"+|"+$/g,'');
      s = s.replace(/[\-_.]20\d{2}(?:[\-_.]?\d{2}){0,2}$/,'');
      const parts = s.split(/[\/:@]/).filter(Boolean);
      s = (parts[parts.length-1]||s).trim();
      if (s.length>28) s = s.slice(0,28)+'…';
      return s;
    }
    function eloProb(ra, rb){ return 1 / (1 + Math.pow(10, (rb - ra)/400)); }
    async function getJSON(url, fallback){
      try{ const r = await fetch(url); if(r.ok) return await r.json(); }catch(e){}
      if (fallback){ try{ const r2 = await fetch(fallback); if(r2.ok) return await r2.json(); }catch(e){} }
      return { bots: [], pairs: [] };
    }
    async function load(){
      const d = await getJSON('/api/matrix', '/web/data/matrix.json');
      const bots = d.bots || [];
      const pairs = d.pairs || [];
      const idx = new Map(bots.map((b,i)=>[b.id,i]));
      const N = bots.length;
      const wins = Array.from({length:N}, ()=>Array(N).fill(null));
      const hands = Array.from({length:N}, ()=>Array(N).fill(0));
      const elo = bots.map(b=>b.elo ?? 1500);
      for(const p of pairs){
        const i = idx.get(p.a_id), j = idx.get(p.b_id);
        hands[i][j] = hands[j][i] = p.hands;
        const total = p.a_wins + p.b_wins;
        const pa = total>0 ? p.a_wins/total : 0.5;
        wins[i][j] = pa; wins[j][i] = 1-pa;
      }
      let html = '<div class="table-wrap"><table class="matrix-table"><thead><tr><th class=\"matrix-sticky\">Model</th>' + bots.map(b=>`<th class=\"rot\" title=\"${b.name}\">${shortName(b.name)}</th>`).join('') + '</tr></thead><tbody>';
      bots.forEach((b, i)=>{
        html += `<tr><th scope="row" class="matrix-sticky"><div>${shortName(b.name)}</div><div class=\"sub\">${b.company}</div></th>`;
        for(let j=0;j<N;j++){
          if(i===j){
            const name = bots[i]?.name || '—';
            const diagTitle = `${name} self-play intentionally left blank`;
            const diagAria = `Self matchup for ${name} — intentionally blank`;
            html += `<td class="matrix-diag" title="${escapeAttr(diagTitle)}" aria-label="${escapeAttr(diagAria)}"></td>`;
            continue;
          }
          const p = wins[i][j];
          const pct = p==null? '—' : Math.round(100*p)+'%';
          const q = wins[j][i];
          const oppPct = q==null? '—' : Math.round(100*q)+'%';
          const exp = Math.round(100*eloProb(elo[i], elo[j]))+'%';
          const aBot = bots[i] || {};
          const bBot = bots[j] || {};
          const aName = aBot.name || '—';
          const bName = bBot.name || '—';
          const pairLabel = `${aName} vs ${bName}`;
          const handCount = hands[i][j] || 0;
          const sample = handCount > 0 ? ` (n=${handCount})` : '';
          const duelLine = `${aName} vs ${bName}: ${pct}${sample} • ${bName} vs ${aName}: ${oppPct}${sample}`;
          const style = heat(p==null?0.5:p);
          const aria = p==null
            ? `${pairLabel} — no completed hands yet`
            : `${pairLabel}: ${pct} over ${handCount} hands. Reverse: ${bName} vs ${aName} ${oppPct}. Expected (Elo) ${exp}.`;
          const hasData = p!=null;
          const dataAttrs = [
            `data-a="${escapeAttr(aName)}"`,
            `data-b="${escapeAttr(bName)}"`,
            `data-a-id="${escapeAttr(String(aBot.id || ''))}"`,
            `data-b-id="${escapeAttr(String(bBot.id || ''))}"`,
            `data-a-full="${escapeAttr(aName)}"`,
            `data-b-full="${escapeAttr(bName)}"`,
            `data-a-company="${escapeAttr(aBot.company || '')}"`,
            `data-b-company="${escapeAttr(bBot.company || '')}"`,
            `data-pct="${escapeAttr(pct)}"`,
            `data-opp="${escapeAttr(oppPct)}"`,
            `data-hands="${escapeAttr(handCount)}"`,
            `data-exp="${escapeAttr(exp)}"`,
            `data-has-data="${hasData ? 'true' : 'false'}"`
          ].join(' ');
          html += `<td class="num matrix-cell" style="${style}" ${dataAttrs} aria-label="${escapeAttr(aria)}" tabindex="0" role="button" aria-pressed="false">${pct}</td>`;
        }
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      $('#matrix').innerHTML = html;
      initMatrixInteractions();
    }
    function ensureTooltip(){
      if(!matrixTooltip){
        matrixTooltip = document.createElement('div');
        matrixTooltip.className = 'matrix-tooltip';
        matrixTooltip.setAttribute('role', 'tooltip');
        matrixTooltip.setAttribute('aria-hidden', 'true');
        matrixTooltip.style.left = '-9999px';
        matrixTooltip.style.top = '-9999px';
        document.body.appendChild(matrixTooltip);
      }
      return matrixTooltip;
    }
    function hideTooltip(){
      if(matrixTooltip){
        matrixTooltip.classList.remove('visible');
        matrixTooltip.setAttribute('aria-hidden', 'true');
        matrixTooltip.style.left = '-9999px';
        matrixTooltip.style.top = '-9999px';
      }
      tooltipActiveCell = null;
    }
    function positionTooltip(event, cell){
      const tooltipEl = ensureTooltip();
      if(!tooltipEl.classList.contains('visible')) return;
      let x;
      let y;
      if(event && typeof event.clientX === 'number' && typeof event.clientY === 'number'){
        x = event.clientX + 18;
        y = event.clientY + 18;
      }else if(cell){
        const rect = cell.getBoundingClientRect();
        x = rect.left + rect.width/2;
        y = rect.top + rect.height + 18;
      }else{
        x = window.innerWidth/2;
        y = window.innerHeight/2;
      }
      tooltipEl.style.left = '0px';
      tooltipEl.style.top = '0px';
      const { width, height } = tooltipEl.getBoundingClientRect();
      const padding = 16;
      let left = Math.min(x, window.innerWidth - width - padding);
      let top = Math.min(y, window.innerHeight - height - padding);
      left = Math.max(padding, left);
      top = Math.max(padding, top);
      tooltipEl.style.left = `${left}px`;
      tooltipEl.style.top = `${top}px`;
    }
    function showTooltip(cell, event){
      if(!cell) return;
      const tooltipEl = ensureTooltip();
      tooltipActiveCell = cell;
      const a = cell.dataset.a || '—';
      const b = cell.dataset.b || '—';
      const pct = cell.dataset.pct || '—';
      const opp = cell.dataset.opp || '—';
      const exp = cell.dataset.exp || '—';
      const handCount = Number(cell.dataset.hands || '0');
      const hasData = cell.dataset.hasData === 'true';
      const headline = hasData ? `${pct} win rate` : 'Awaiting results';
      const reverseLine = hasData ? `Reverse: ${opp}` : '';
      const sampleLine = hasData && handCount > 0
        ? `Sample size: ${formatNumber(handCount)} hands`
        : 'Sample size: —';
      tooltipEl.innerHTML = `
        <div class="matrix-tooltip__matchup">
          <span class="matrix-tooltip__model">${escapeAttr(a)}</span>
          <span class="matrix-tooltip__versus">vs</span>
          <span class="matrix-tooltip__model">${escapeAttr(b)}</span>
        </div>
        <div class="matrix-tooltip__stat">${escapeAttr(headline)}</div>
        ${reverseLine ? `<div class="matrix-tooltip__meta">${escapeAttr(reverseLine)}</div>` : ''}
        <div class="matrix-tooltip__meta">${escapeAttr(sampleLine)}</div>
        <div class="matrix-tooltip__meta">Elo expectation: ${escapeAttr(exp)}</div>
      `;
      tooltipEl.classList.add('visible');
      tooltipEl.setAttribute('aria-hidden', 'false');
      positionTooltip(event, cell);
    }
    function updateDetailPanel(cell){
      if(!cell) return;
      if(activePinnedCell && activePinnedCell !== cell){
        activePinnedCell.classList.remove('matrix-cell--active');
        activePinnedCell.setAttribute('aria-pressed', 'false');
      }
      cell.classList.add('matrix-cell--active');
      cell.setAttribute('aria-pressed', 'true');
      activePinnedCell = cell;
    }
    function initMatrixInteractions(){
      const cells = document.querySelectorAll('#matrix .matrix-cell');
      if(!cells.length) return;
      ensureTooltip();
      if(!tooltipScrollHandlerAttached){
        document.addEventListener('scroll', hideTooltip, { capture: true, passive: true });
        window.addEventListener('resize', hideTooltip, { passive: true });
        tooltipScrollHandlerAttached = true;
      }
      function handleCellSelection(cell){
        if (!cell) return;
        hideTooltip();
        updateDetailPanel(cell);
        if (compareDrawer){
          const aId = Number(cell.dataset.aId || '0');
          const bId = Number(cell.dataset.bId || '0');
          if (Number.isFinite(aId) && Number.isFinite(bId) && aId > 0 && bId > 0){
            const meta = {
              aId,
              bId,
              aName: cell.dataset.aFull || cell.dataset.a || '—',
              bName: cell.dataset.bFull || cell.dataset.b || '—',
              aShort: shortName(cell.dataset.aFull || cell.dataset.a || ''),
              bShort: shortName(cell.dataset.bFull || cell.dataset.b || ''),
              aCompany: cell.dataset.aCompany || '',
              bCompany: cell.dataset.bCompany || ''
            };
            compareDrawer.showMatchup({ aId, bId, meta });
          }
        }
      }

      cells.forEach(cell=>{
        cell.addEventListener('mouseenter', event=>{
          showTooltip(cell, event);
        });
        cell.addEventListener('mousemove', event=>{
          if(tooltipActiveCell === cell){
            positionTooltip(event, cell);
          }
        });
        cell.addEventListener('mouseleave', hideTooltip);
        cell.addEventListener('focus', ()=>{
          showTooltip(cell);
        });
        cell.addEventListener('blur', hideTooltip);
        cell.addEventListener('click', event=>{
          event.preventDefault();
          handleCellSelection(cell);
        });
        cell.addEventListener('keydown', event=>{
          if(event.key === 'Enter' || event.key === ' '){
            event.preventDefault();
            handleCellSelection(cell);
          }
        });
      });
    }
    addEventListener('DOMContentLoaded', load);
  </script>
