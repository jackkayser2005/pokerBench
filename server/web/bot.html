<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AI Poker Lab — Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml"/>
  <script src="/web/theme-init.js"></script>
  <link rel="stylesheet" href="/web/app.css?v=11"/>
  <script src="/web/app.js" defer></script>
  <script>
    // -------------------- helpers / boot --------------------
    const $ = s => document.querySelector(s);
    const q = new URLSearchParams(location.search);
    const id = q.get('id');

    // nav active state
    document.addEventListener('DOMContentLoaded', ()=>{
      document.querySelectorAll('.topnav__links a').forEach(a=>{
        try{
          if(location.pathname.endsWith(a.getAttribute('href').split('/').pop()))
            a.classList.add('active');
        }catch(e){}
      });
    });

    // numbers + labels
    const sum = x => (x==null?0:Number(x)).toLocaleString();
    const pct = x => Number(x||0).toFixed(1);
    const formatUSD = (value, opts = {}) => {
      const amount = Number(value);
      if (!Number.isFinite(amount)) return '$0.00';
      const abs = Math.abs(amount);
      const min = Number.isFinite(opts.minimumFractionDigits)
        ? opts.minimumFractionDigits
        : (abs < 1 ? 3 : 2);
      const max = Number.isFinite(opts.maximumFractionDigits)
        ? opts.maximumFractionDigits
        : min;
      return amount.toLocaleString(undefined, {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: min,
        maximumFractionDigits: max,
      });
    };
    const escapeAttr = (value = '') => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
    const formatSignedChips = (value, fractionDigits = 0) => {
      if (!Number.isFinite(value)) return Number(0).toLocaleString(undefined, {
        minimumFractionDigits: fractionDigits,
        maximumFractionDigits: fractionDigits,
      });
      const absValue = Math.abs(value);
      const formatted = absValue.toLocaleString(undefined, {
        minimumFractionDigits: fractionDigits,
        maximumFractionDigits: fractionDigits,
      });
      if (value > 0) return `+${formatted}`;
      if (value < 0) return `-${formatted}`;
      return formatted;
    };
    function canonicalStyle(s){
      const raw = (s||'').toUpperCase().replace(/[^A-Z]/g,'');
      const map = {
        LAG:'LAG', LOOSEAGGRESSIVE:'LAG',
        TAG:'TAG', TIGHTAGGRESSIVE:'TAG',
        FISH:'FISH', LOOSEPASSIVE:'FISH',
        NIT:'NIT',  TIGHTPASSIVE:'NIT'
      };
      return map[raw] || 'N/A';
    }

    const STYLE_META = {
      LAG: { title: 'Loose Aggressive', label: 'Loose · Aggressive' },
      TAG: { title: 'Tight Aggressive', label: 'Tight · Aggressive' },
      FISH: { title: 'Loose Passive', label: 'Loose · Passive' },
      NIT: { title: 'Tight Passive', label: 'Tight · Passive' },
    };
    const STYLE_ORDER = ['LAG', 'TAG', 'FISH', 'NIT'];

    // -------------------- API-driven sections --------------------
    async function getJSON(url, fallback){
      try{ const r = await fetch(url); if(r.ok) return await r.json(); }catch(e){}
      if (fallback){ try{ const r2 = await fetch(fallback); if(r2.ok) return await r2.json(); }catch(e){} }
      return null;
    }

    async function loadStyle(){
      try{
        const d = await getJSON(`/api/bot-style?id=${encodeURIComponent(id)}`, `/web/data/bot-style-${encodeURIComponent(id)}.json`);
        if(!d) return;
        const styleCode = canonicalStyle(d.style);
        const wrap = $('#playstyle');
        if(!wrap) return;
        const activeKey = STYLE_META[styleCode] ? styleCode : 'N/A';
        const badgeText = STYLE_META[styleCode]?.title || 'Unknown style';
        const cells = STYLE_ORDER.map(key => {
          const meta = STYLE_META[key];
          if (!meta) return '';
          const isActive = key === activeKey;
          return `
            <button type="button" class="playstyle-grid__cell${isActive ? ' is-active' : ''}" data-style="${key}" data-label="${meta.title}" aria-label="${meta.title}">
              <span class="playstyle-grid__abbr">${key}</span>
              <span class="playstyle-grid__text">${meta.label}</span>
            </button>`;
        }).join('');

        wrap.innerHTML = `
          <div class="playstyle-card" data-style="${activeKey}">
            <div class="playstyle-card__header">
              <div class="playstyle-card__header-text">
                <span class="playstyle-card__label">Playstyle</span>
                <span class="playstyle-card__hint">Click a quadrant for details</span>
              </div>
              <span class="playstyle-card__badge">${badgeText}</span>
            </div>
            <div class="style-grid playstyle-grid" data-style="${activeKey}" role="list">
              ${cells}
            </div>
            <dl class="playstyle-card__stats">
              <div class="playstyle-card__stat">
                <dt>Raise</dt>
                <dd>${pct(d.raise_pct)}%</dd>
              </div>
              <div class="playstyle-card__stat">
                <dt>Call</dt>
                <dd>${pct(d.call_pct)}%</dd>
              </div>
              <div class="playstyle-card__stat">
                <dt>Fold</dt>
                <dd>${pct(d.fold_pct)}%</dd>
              </div>
            </dl>
          </div>`;
      }catch{/* noop */}
    }

    async function load(){
      if (!id) {
        document.body.innerHTML = '<div class="wrap wrap--wide"><div class="card">Missing id</div></div>';
        return;
      }
      const d = await getJSON(`/api/bot?id=${encodeURIComponent(id)}`, `/web/data/bot-${encodeURIComponent(id)}.json`);
      if (!d) { document.body.innerHTML = '<div class="wrap wrap--wide"><div class="card">Bot not found</div></div>'; return; }
      const c = d.career || {};
      const totalHands = Number(c.total_hands ?? c.hands ?? 0);
      const totalCostMicros = Number(c.total_cost_micro ?? 0);
      const totalCostUSD = totalCostMicros / 1_000_000;
      const llmCalls = Number(c.llm_calls ?? 0);
      const promptTokens = Number(c.prompt_tokens ?? 0);
      const completionTokens = Number(c.completion_tokens ?? 0);
      const totalTokens = Number(c.total_tokens ?? (promptTokens + completionTokens));
      const costPerHandUSD = totalHands > 0 ? totalCostUSD / totalHands : null;
      const costPer50 = Number.isFinite(costPerHandUSD) ? costPerHandUSD * 50 : null;
      const hasCostData = Number.isFinite(costPer50) && llmCalls > 0;
      const costDisplay = hasCostData
        ? formatUSD(costPer50, { minimumFractionDigits: costPer50 < 1 ? 3 : 2, maximumFractionDigits: costPer50 < 1 ? 3 : 2 })
        : '&mdash;';
      const costTip = (() => {
        if (!hasCostData) {
          if (totalHands <= 0) {
            return 'Average cost per 50 hands will appear once this bot has completed at least one hand on PokerBench.';
          }
          return 'Cost per 50 hands is unavailable because no usage data has been recorded for this bot yet.';
        }
        const totalHandsLabel = sum(totalHands);
        const totalCostLabel = formatUSD(totalCostUSD, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const perHandLabel = formatUSD(costPerHandUSD, { minimumFractionDigits: 4, maximumFractionDigits: 4 });
        const per50Label = formatUSD(costPer50, { minimumFractionDigits: costPer50 < 1 ? 3 : 2, maximumFractionDigits: costPer50 < 1 ? 3 : 2 });
        const callsLabel = sum(llmCalls);
        const totalTokenLabel = sum(totalTokens);
        const promptLabel = sum(promptTokens);
        const completionLabel = sum(completionTokens);
        return `OpenRouter spend across ${totalHandsLabel} hands: ${totalCostLabel} total (${perHandLabel} per hand, ${per50Label} per 50 hands). ${callsLabel} API calls covering ${totalTokenLabel} tokens (prompt ${promptLabel}, completion ${completionLabel}).`;
      })();
      const costTipAttr = escapeAttr(costTip);

      // Header
      $('#title').textContent = c.model || 'Bot';
      $('#sub').textContent   = `Elo ${(Number(c.elo)||0).toFixed(1)}`;

      // Meta KVs
      $('#meta').innerHTML = `
        <div class="muted">Matches</div><div>${sum(c.matches)}</div>
        <div class="muted">Hands</div><div>${sum(totalHands)}</div>
        <div class="muted">Cost / 50 hands <button class="inline-tip" type="button" data-tip="${costTipAttr}" aria-label="Tip: how cost per 50 hands is calculated">i</button></div><div>${costDisplay}</div>
        <div class="muted">Accuracy</div><div id="meta-acc">&mdash;</div>
        <div class="muted">Updated</div><div>${c.updated_at ? new Date(c.updated_at).toLocaleString() : '-'}</div>`;

      // Judge accuracy (best-effort) + polling
      async function refreshAcc(){
        try {
          const ja = await getJSON('/api/judge-accuracy', '/web/data/judge-accuracy.json');
          if (ja && ja.rows) {
            const row = (ja.rows||[]).find(x => String(x.bot_id) === String(c.bot_id || id));
            const el = document.getElementById('meta-acc');
            if (!el) return;
            if (row && typeof row.total === 'number') {
              if (row.total > 0) {
                const acc = (typeof row.acc === 'number' && !Number.isNaN(row.acc)) ? row.acc : ((row.good || 0) / Math.max(row.total, 1));
                const pct = Math.round(Math.max(0, Math.min(1, acc)) * 100);
                el.textContent = `${pct}% (${row.good||0}/${row.total})`;
              } else {
                el.textContent = 'n/a';
              }
            }
          }
        } catch {}
      }
      refreshAcc();
      setInterval(refreshAcc, 10000);

      // Playstyle block
      loadStyle();

      // Recent matches
      const rows = d.matches || [];
      $('#tbody').innerHTML = rows.map(m => `
        <tr>
          <td class="num">${m.match_id}</td>
          <td>${m.created_at ? new Date(m.created_at).toLocaleString() : '—'}</td>
          <td>${m.ended_at ? new Date(m.ended_at).toLocaleString() : 'in progress'}</td>
          <td>${m.label ?? ''}</td>
          <td>${m.opponent_model ?? ''}</td>
          <td class="num">${sum(m.start_bank)}</td>
          <td class="num">${sum(m.end_bank)}</td>
          <td class="num">${sum(m.wins)}</td>
          <td class="num">${sum(m.hands)}</td>
          <td class="num">${sum(m.net_chips)}</td>
          <td class="num">${sum(m.check)}</td>
          <td class="num">${sum(m.call)}</td>
          <td class="num">${sum(m.raise)}</td>
          <td class="num">${sum(m.fold)}</td>
        </tr>
      `).join('');
    }

    // -------------------- Playstyle tooltip (enhanced) --------------------
    let tipEl, tipAnchor = null, autoHideTimer = null;

    function hideTip(){
      if (!tipEl) return;
      tipEl.classList.remove('show');
      tipEl.style.display = 'none';
      tipAnchor = null;
      if (autoHideTimer) { clearTimeout(autoHideTimer); autoHideTimer = null; }
    }

    function positionTip(){
      if (!tipEl || !tipAnchor || !tipEl.classList.contains('show')) return;
      const rect = tipAnchor.getBoundingClientRect();
      const w = tipEl.offsetWidth || 260;
      const h = tipEl.offsetHeight || 90;
      const maxLeft = window.scrollX + document.documentElement.clientWidth - 16 - w;
      const left = Math.min(maxLeft, Math.max(8, rect.left + window.scrollX));
      const top  = Math.max(8, rect.top + window.scrollY - h - 8);
      tipEl.style.left = left + 'px';
      tipEl.style.top  = top  + 'px';
    }

    function showTip(anchor, styleKey, displayLabel){
      const explain = {
        LAG:'Loose-Aggressive: plays many hands and applies pressure with bets/raises.',
        TAG:'Tight-Aggressive: selects stronger ranges and applies pressure.',
        FISH:'Loose-Passive: calls too much, weak ranges.',
        NIT:'Very tight/passive: waits for premiums, folds often.'
      };
      tipAnchor = anchor;
      const key = (styleKey || '').toUpperCase();
      const title = displayLabel || STYLE_META[key]?.title || key || 'Playstyle';
      tipEl.innerHTML =
        '<button class="close" aria-label="Close">×</button>' +
        '<div class="title">'+title+'</div>' +
        '<div class="body">'+(explain[key]||'Playstyle summary.')+'</div>';

      tipEl.style.display = 'block';
      tipEl.classList.add('show');
      positionTip();

      // Auto-hide after 5s
      if (autoHideTimer) clearTimeout(autoHideTimer);
      autoHideTimer = setTimeout(hideTip, 5000);
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      tipEl = document.getElementById('tip-pop');
      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.id = 'tip-pop';
        tipEl.className = 'tooltip-pop';
        document.body.appendChild(tipEl);
      }

      // Guaranteed close: local listener on the popover
      tipEl.addEventListener('click', (ev)=>{
        if (ev.target.closest('.close')) hideTip();
      });

      // Toggle via clicks
      document.addEventListener('click', (ev)=>{
        const cell = ev.target.closest('.playstyle-grid__cell');
        if (cell) {
          const styleKey = cell.getAttribute('data-style') || 'N/A';
          const display = cell.getAttribute('data-label') || STYLE_META[styleKey]?.title || styleKey;
          if (tipEl.classList.contains('show') && tipAnchor === cell) {
            hideTip();
          } else {
            showTip(cell, styleKey, display);
          }
          return;
        }
        if (!ev.target.closest('.style-grid') && !ev.target.closest('#tip-pop')) hideTip();
      });

      // Close on Escape
      document.addEventListener('keydown', (e)=>{
        if (e.key === 'Escape') hideTip();
      });

      // Keep anchored on scroll/resize
      window.addEventListener('scroll', positionTip, { passive:true });
      window.addEventListener('resize', positionTip);
    });

    // -------------------- boot --------------------
    addEventListener('DOMContentLoaded', load);
  </script>
</head>

        <button class="pill nav-link topnav__toggle" type="button" aria-expanded="false" aria-controls="primaryNav">

        <button class="pill nav-link nav-settings" type="button" aria-expanded="false" aria-controls="navSettingsPanel">

              <circle cx="9" cy="6" r="2" fill="none"></circle>
