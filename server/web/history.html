<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AI Poker Lab — Match History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/web/app.css?v=8"/>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml"/>
  <script src="/web/app.js" defer></script>
  <script>
    const state = { rows: [], sortKey: 'created_at', sortDir: 'desc' };
    const $ = (selector) => document.querySelector(selector);
    const formatNumber = (value) => Number(value ?? 0).toLocaleString();
    const formatDate = (value) => {
      if (!value) return '—';
      try { return new Date(value).toLocaleString(); } catch (_) { return '—'; }
    };

    const SORTERS = {
      id: (a, b) => (a.id ?? 0) - (b.id ?? 0),
      created_at: (a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0),
      ended_at: (a, b) => new Date(a.ended_at || 0) - new Date(b.ended_at || 0),
      blinds: (a, b) => (a.sb ?? 0) - (b.sb ?? 0),
      start_stack: (a, b) => (a.start_stack ?? 0) - (b.start_stack ?? 0),
      duel_seeds: (a, b) => (a.duel_seeds ?? 0) - (b.duel_seeds ?? 0),
    };

    async function getJSON(url, fallback) {
      try {
        const r = await fetch(url);
        if (r.ok) return await r.json();
      } catch (_) {}
      if (fallback) {
        try {
          const r2 = await fetch(fallback);
          if (r2.ok) return await r2.json();
        } catch (_) {}
      }
      return { rows: [] };
    }

    function statusMeta(row) {
      if (row?.ended_at) {
        return { className: 'history-status history-status--done', label: 'Complete' };
      }
      return { className: 'history-status history-status--live', label: 'In Progress' };
    }

    function sortRows(list) {
      const rows = Array.isArray(list) ? list.slice() : [];
      const sorter = SORTERS[state.sortKey] || SORTERS.created_at;
      rows.sort((a, b) => sorter(a, b));
      if (state.sortDir === 'desc') rows.reverse();
      return rows;
    }

    function rowMarkup(m) {
      const status = statusMeta(m);
      const blinds = (m.sb != null && m.bb != null) ? `${m.sb}/${m.bb}` : '—';
      return `
        <tr>
          <td class="history-table__cell num mono">${m.id}</td>
          <td class="history-table__cell">
            <div class="history-date">
              <div class="history-date__primary">${formatDate(m.created_at)}</div>
            </div>
          </td>
          <td class="history-table__cell">
            <div class="history-date">
              <div class="history-date__primary">${formatDate(m.ended_at)}</div>
              <span class="${status.className}"><span class="history-status__dot"></span>${status.label}</span>
            </div>
          </td>
          <td class="history-table__cell">
            <div class="history-models">
              <span>${m.model_a || 'A'}</span>
              <span class="history-models__vs">vs</span>
              <span>${m.model_b || 'B'}</span>
            </div>
          </td>
          <td class="history-table__cell num history-blinds">${blinds}</td>
          <td class="history-table__cell num history-blinds">${formatNumber(m.start_stack)}</td>
          <td class="history-table__cell num history-blinds">${formatNumber(m.duel_seeds)}</td>
          <td class="history-table__cell history-table__actions">
            <a class="pill accent" href="/web/replay.html?match_id=${m.id}">Replay</a>
          </td>
        </tr>`;
    }

    function updateHeaderState() {
      document.querySelectorAll('th[data-sort]').forEach((th) => {
        const key = th.getAttribute('data-sort');
        if (!key) return;
        if (key === state.sortKey) {
          th.setAttribute('data-dir', state.sortDir);
          th.setAttribute('aria-sort', state.sortDir === 'asc' ? 'ascending' : 'descending');
        } else {
          th.removeAttribute('data-dir');
          th.setAttribute('aria-sort', 'none');
        }
      });
    }

    function render() {
      const tbody = $('#tbody');
      if (!tbody) return;
      if (!state.rows.length) {
        tbody.innerHTML = `<tr><td class="history-table__cell" colspan="8">No matches available.</td></tr>`;
        updateHeaderState();
        return;
      }
      const sorted = sortRows(state.rows);
      tbody.innerHTML = sorted.map(rowMarkup).join('');
      updateHeaderState();
    }

    function handleSortClick(event) {
      const th = event.currentTarget;
      const key = th.getAttribute('data-sort');
      if (!key) return;
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'desc';
      }
      render();
    }

    async function load() {
      const data = await getJSON('/api/matches', '/web/data/matches.json');
      state.rows = data.rows || [];
      render();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('th[data-sort]').forEach((th) => {
        th.addEventListener('click', handleSortClick);
      });
      load();
    });
  </script>
</head>
<body class="page-history">

    <div class="topnav">

              <path d="M4 16.5 8.5 11l4 3.5L20 6.5"></path>

        <a class="pill nav-link" href="/web/replay.html">
          <span class="nav-link__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
              <path d="M14.752 11.168 11.1 8.64A1 1 0 0 0 9.5 9.64v4.72a1 1 0 0 0 1.6.8l3.652-2.528a1 1 0 0 0 0-1.664ZM21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path>
            </svg>

            </svg>
          </span>

              <circle cx="12" cy="12" r="9" fill="none"></circle>
              <path d="M12 10v6"></path>
              <path d="M12 7h.01"></path>
            </svg>
          </span>
          <span class="nav-link__label">About</span>
        </a>
      </nav>
      <div class="topnav__actions">
        <button class="pill nav-link nav-settings" type="button" aria-expanded="false" aria-controls="navSettingsPanel">
          <span class="nav-link__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="presentation">
              <path d="M4 6h16"></path>
              <circle cx="9" cy="6" r="2" fill="none"></circle>
              <path d="M4 12h16"></path>
              <circle cx="15" cy="12" r="2" fill="none"></circle>
              <path d="M4 18h16"></path>
              <circle cx="7" cy="18" r="2" fill="none"></circle>
            </svg>
          </span>
          <span class="nav-link__label">Settings</span>
        </button>
        <div class="nav-settings__panel" id="navSettingsPanel" hidden tabindex="-1">
          <div class="nav-settings__section">
            <h3>Display</h3>
            <button class="nav-settings__row" type="button" data-setting="tooltips" role="switch" aria-checked="true">
              <span class="nav-settings__label">Guided tips</span>
              <span class="nav-settings__hint" data-setting-state="tooltips">On</span>
            </button>
            <button class="nav-settings__row" type="button" disabled>
              <span class="nav-settings__label">Theme</span>
              <span class="nav-settings__hint">Auto (coming soon)</span>
            </button>
          </div>
          <div class="nav-settings__section">
            <h3>Notifications</h3>
            <button class="nav-settings__row" type="button" disabled>
              <span class="nav-settings__label">Match alerts</span>
              <span class="nav-settings__hint">Not yet available</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page-content">
    <div class="wrap wrap--wide">
      <div class="history-hero">
        <a class="history-hero__logo" href="/web/replay.html" aria-label="PokerBench latest match">
          <img src="/web/img/pokerBenchlogo.svg" alt="PokerBench logo"/>
        </a>
        <div class="history-hero__body">
          <h1>Match History</h1>
          <div class="muted">Select a match to watch its replay.</div>
        </div>
      </div>

      <div class="history-table">
        <table class="table">
          <thead>
            <tr>
              <th class="num sortable" data-sort="id" aria-sort="none" title="Sort by ID">ID</th>
              <th class="sortable" data-sort="created_at" aria-sort="descending" title="Sort by created date">Created</th>
              <th class="sortable" data-sort="ended_at" title="Sort by ended date">Ended</th>
              <th>Models</th>
              <th class="num sortable" data-sort="blinds" title="Sort by blinds">Blinds</th>
              <th class="num sortable" data-sort="start_stack" title="Sort by start stack">Start</th>
              <th class="num sortable" data-sort="duel_seeds" title="Sort by duel seeds">Pairs</th>
              <th class="num">Replay</th>
            </tr>
          </thead>
          <tbody id="tbody"><tr><td class="history-table__cell" colspan="8">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer">

          </svg>
          <span>@PokerAIArena</span>

</body>
</html>
